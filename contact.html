
<!DOCTYPE html>
<html>
<head>
    <title>SnapStand - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>SnapStand</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="features">

        <h2>Get in Touch</h2>

        <p>
            Have questions about SnapStand?
            We would love to hear from you!
        </p>

        <div class="feature-card" style="margin: 30px auto;">

            <h3>Contact Us</h3>

            <p>Email: support@snapstand.com</p>
            <p>Phone: +92 300 1234567</p>

            <h3>Send Us a Message</h3>

            <input type="text" id="name" placeholder="Your Name">
            <br><br>

            <input type="email" id="email" placeholder="Your Email">
            <br><br>

            <textarea id="message" placeholder="Your Message"
                rows="5"></textarea>
            <br><br>

            <button onclick="sendMessage()">Submit Message</button>

        </div>

    </section>

    <footer>
        <p>© 2026 SnapStand. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
